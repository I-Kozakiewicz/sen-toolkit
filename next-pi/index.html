<style>:root{color-scheme:light;--ink:#182b33;--paper:#f8f7f2;--white:#fff;--sage:#deeadf;--muted:#4c6060;--border:#cbd6ce}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 system-ui,sans-serif}
[hidden]{display:none!important}
header,main,footer{width:min(100% - 2rem,54rem);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--border)}
header span,footer{color:var(--muted);font-size:.875rem}
.brand{display:flex;align-items:center;gap:.6rem;color:inherit;text-decoration:none;letter-spacing:.09em}
.brand img{border-radius:11px}
main{padding:clamp(1.5rem,5vw,3.5rem) 0 2rem}
h1,h2,p{margin:0}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.12;letter-spacing:-.045em}
h2{font-size:1.45rem;line-height:1.25}
.intro{margin:.65rem 0 1.5rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
article,.photo,#finish{background:var(--white);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.cover{display:block;width:100%;height:clamp(10rem,29vw,15rem);object-fit:cover;object-position:center 36%}
.info{padding:1.15rem;display:grid;gap:.65rem;justify-items:start}
.info p,#finish p{color:var(--muted)}
.tag{display:inline-block;background:var(--sage);border-radius:99px;padding:.18rem .65rem;font-size:.82rem;font-weight:650}
button{font:inherit;font-weight:700;min-height:46px;border:1px solid var(--ink);border-radius:10px;padding:.55rem 1rem;background:var(--ink);color:var(--white);cursor:pointer}
button:hover{filter:brightness(1.18)}
button:focus-visible,a:focus-visible{outline:3px solid #21734c;outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
.secondary,.link{background:transparent;color:var(--ink)}
.link{padding-inline:0;border:0;margin-bottom:1rem}
#player{max-width:32rem;margin:auto}
#progressRow{margin:.75rem 0}
#progressText{color:var(--muted)}
progress{width:100%;height:.8rem;accent-color:#326c53}
.photo{background:var(--sage);display:grid;place-items:center}
#photo{display:block;width:min(100%,20rem);aspect-ratio:1;object-fit:contain}
#stepTitle{text-align:center;margin:1rem 0}
#finish{padding:2rem}
#finish p{margin-top:.5rem}
.controls{display:flex;gap:.65rem;margin-top:1rem;flex-wrap:wrap}
.controls button{flex:1}
footer{border-top:1px solid var(--border);padding:1rem 0 2rem}
@media(max-width:38rem){.grid{grid-template-columns:1fr}.cover{height:12rem}}
</style>

const library = document.querySelector('#library');
const player = document.querySelector('#player');
const start = document.querySelector('#start');
const preview = document.querySelector('#preview');
const back = document.querySelector('#back');
const previous = document.querySelector('#previous');
const advance = document.querySelector('#advance');
const packTitle = document.querySelector('#packTitle');
const step = document.querySelector('#step');
const stepTitle = document.querySelector('#stepTitle');
const photo = document.querySelector('#photo');
const progress = document.querySelector('#progress');
const progressText = document.querySelector('#progressText');
const finish = document.querySelector('#finish');
const finishTitle = document.querySelector('#finishTitle');
const finishText = document.querySelector('#finishText');
const storageKey = 'senco-next-pi-morning-v1';
let activePack = 'morning';
let position = 0;
let savedPosition = 0;

try {
  const stored = Number(localStorage.getItem(storageKey));
  if (Number.isInteger(stored) && stored >= 0 && stored <= packs.morning.length) {
    savedPosition = stored;
  }
} catch {
  document.querySelector('footer').textContent = 'Morning progress is available during this visit.';
}

function saveProgress() {
  if (activePack !== 'morning') return;
  savedPosition = position;
  try {
    localStorage.setItem(storageKey, String(position));
  } catch {
    document.querySelector('footer').textContent = 'Morning progress is available during this visit.';
  }
}

function showLibrary() {
  player.hidden = true;
  library.hidden = false;
  start.textContent = savedPosition > 0 && savedPosition < packs.morning.length ? 'Resume routine' : 'Start routine';
  (activePack === 'morning' ? start : preview).focus();
}

function renderCard(moveFocus = true) {
  const cards = packs[activePack];
  const morning = activePack === 'morning';
  const complete = position === cards.length;
  step.hidden = complete;
  finish.hidden = !complete;
  previous.hidden = complete;
  previous.disabled = position === 0;
  progress.max = cards.length;
  progress.value = complete ? cards.length : position + 1;
  const unit = morning ? 'Step' : 'Card';
  progressText.textContent = complete ? `${cards.length} ${morning ? 'steps done' : 'cards viewed'}` :
    `${unit} ${position + 1} of ${cards.length}`;
  if (complete) {
    advance.textContent = morning ? 'Start again' : 'Back to library';
    finishTitle.textContent = morning ? 'Routine complete' : 'Preview complete';
    finishText.textContent = morning ? 'You finished your morning routine.' : 'You’ve seen the first three Laundry cards.';
    if (moveFocus) finishTitle.focus();
    return;
  }
  const card = cards[position];
  photo.src = card.photo;
  stepTitle.textContent = card.title;
  advance.textContent = morning ? 'Mark done' : position === cards.length - 1 ? 'Finish preview' : 'Next card';
  if (moveFocus) stepTitle.focus();
}

function openPack(pack) {
  activePack = pack;
  const morning = pack === 'morning';
  position = morning && savedPosition < packs.morning.length ? savedPosition : 0;
  packTitle.textContent = morning ? 'Morning routine' : 'Laundry preview';
  library.hidden = true;
  player.hidden = false;
  saveProgress();
  renderCard(false);
  packTitle.focus();
}

start.addEventListener('click', () => openPack('morning'));
preview.addEventListener('click', () => openPack('laundry'));
back.addEventListener('click', showLibrary);
previous.addEventListener('click', () => {
  if (position === 0) return;
  position -= 1;
  saveProgress();
  renderCard();
});
advance.addEventListener('click', () => {
  if (position === packs[activePack].length) {
    if (activePack === 'laundry') {
      showLibrary();
      return;
    }
    position = 0;
  } else {
    position += 1;
  }
  saveProgress();
  renderCard();
});

if (savedPosition > 0 && savedPosition < packs.morning.length) start.textContent = 'Resume routine';
</script>
